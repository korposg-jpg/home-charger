[project]
name = "csms"
version = "0.1.0"
description = "Small OCPP 1.6J central system for a home dual-connector wallbox"
requires-python = ">=3.11"
dependencies = [
    "ocpp>=2.1,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
csms = "csms.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["csms*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# Blocking os.path calls at startup are fine.
ignore = ["ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["csms", "conftest"]
