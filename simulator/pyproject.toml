[project]
name = "evsim"
version = "0.1.0"
description = "Simulated Depow DE-2 dual wallbox (OCPP 1.6J charge point)"
requires-python = ">=3.11"
dependencies = [
    "ocpp>=2.1,<3",
    "websockets>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
evsim = "evsim.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evsim*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
